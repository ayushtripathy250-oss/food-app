  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;


const D = {
  bg: "#000000", surface: "#0A0A0A", card: "#141414", border: "#2A2A2A", faint: "#1C1C1C",
  text: "#FFFFFF", muted: "#666666",
  green: "#4ADE80", greenDim: "rgba(74,222,128,0.12)", greenGlow: "rgba(74,222,128,0.08)",
  blue: "#60A5FA", blueDim: "rgba(96,165,250,0.12)", blueGlow: "rgba(96,165,250,0.08)",
  amber: "#FBBF24", amberDim: "rgba(251,191,36,0.12)", amberGlow: "rgba(251,191,36,0.08)",
  red: "#F87171", redDim: "rgba(248,113,113,0.12)", redGlow: "rgba(248,113,113,0.08)",
  purple: "#A78BFA", purpleDim: "rgba(167,139,250,0.12)", purpleGlow: "rgba(167,139,250,0.08)",
  water: "#38BDF8", waterDim: "rgba(56,189,248,0.12)", waterGlow: "rgba(56,189,248,0.08)",
};

const DAILY_GOALS = { calories: 2000, carbs: 250, protein: 125, fat: 65, water: 2000 };
const ML_PER_GLASS = 250;

const parseFood = async (input) => {
  const res = await fetch("/api/claude", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 1000,
      messages: [{ role: "user", content: `Parse this food/exercise log entry and return ONLY a JSON object (no markdown, no backticks): "${input}"\nReturn: {"type":"food" or "exercise","name":"display name","quantity":"e.g. 100g, 1 cup, 30 min","calories":number,"carbs":number,"protein":number,"fat":number,"burnedCalories":number}\nFor exercise: calories=0, burnedCalories=estimated burn. Be realistic.` }]
    })
  });
  const data = await res.json();
  return JSON.parse(data.content.map(i => i.text || "").join("").replace(/```json|```/g, "").trim());
};

const calcPersonalisedGoals = async (profile) => {
  const res = await fetch("/api/claude", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 1000,
      messages: [{ role: "user", content: `Calculate personalised daily nutrition goals for this person. Return ONLY a JSON object (no markdown, no backticks, no explanation):
Profile:
- Age: ${profile.age} years
- Sex: ${profile.sex}
- Height: ${profile.height} cm
- Current weight: ${profile.weight} kg
- Activity level: ${profile.activity} (sedentary/lightly active/moderately active/very active/athlete)
- Fitness goal: ${profile.goal} (lose weight/maintain/build muscle/athletic performance)

Return: {"calories":number,"protein":number,"carbs":number,"fat":number,"water":number,"bmr":number,"tdee":number,"reasoning":"2-3 sentence explanation of the targets"}
All macros in grams, water in ml (not glasses). Be scientifically accurate using Mifflin-St Jeor for BMR.` }]
    })
  });
  const data = await res.json();
  return JSON.parse(data.content.map(i => i.text || "").join("").replace(/```json|```/g, "").trim());
};

const calcWaterGoal = async (wp) => {
  const res = await fetch("/api/claude", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 600,
      messages: [{ role: "user", content: `Calculate a personalised daily water intake goal. Return ONLY a JSON object (no markdown, no backticks):
Person:
- Weight: ${wp.weight} kg
- Sex: ${wp.sex}
- Activity level: ${wp.activity}
- Climate: ${wp.climate} (temperate/hot and humid/hot and dry/cold)
- Exercises today: ${wp.exercises} (none/light <30min/moderate 30-60min/intense >60min)
- Pregnant or breastfeeding: ${wp.pregnant}

Use the 35ml/kg baseline, then adjust for activity (+500ml moderate, +750ml intense), climate (hot+humid +500ml, hot+dry +400ml), sex (women slightly less), pregnancy (+300ml), breastfeeding (+700ml). Round totalMl to nearest 50ml.

Return: {"totalMl":number,"breakdown":{"baselineMl":number,"activityMl":number,"climateMl":number,"otherMl":number},"tip":"one practical personalised tip about hitting this goal","reasoning":"2 sentences explaining the calculation"}` }]
    })
  });
  const data = await res.json();
  return JSON.parse(data.content.map(i => i.text || "").join("").replace(/```json|```/g, "").trim());
};

// ── Design helpers ────────────────────────────────────────────────────────────
const card = { background: D.card, border: `1px solid ${D.border}`, borderRadius: 16, padding: 16, marginBottom: 12 };

const MacroBar = ({ label, current, goal, color, icon, delay = 0 }) => {
  const [w, setW] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setW(Math.min((current / (goal || 1)) * 100, 100)), 150 + delay);
    return () => clearTimeout(t);
  }, [current, goal, delay]);
  const icons = { "ti-bread": "🍞", "ti-meat": "🥩", "ti-droplet-half-2": "🫧" };
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ fontSize: 11 }}>{icons[icon]}</span>
          <span style={{ fontSize: 10, color: D.muted, textTransform: "uppercase", letterSpacing: "0.07em", fontWeight: 600 }}>{label}</span>
        </div>
        <span style={{ fontSize: 10, color: D.text, fontWeight: 600 }}>{current}<span style={{ color: D.muted, fontWeight: 400 }}>/{goal}g</span></span>
      </div>
      <div style={{ height: 4, borderRadius: 2, background: D.faint }}>
        <div style={{ height: 4, borderRadius: 2, background: color, width: `${w}%`, transition: "width 0.8s cubic-bezier(0.4,0,0.2,1)", boxShadow: `0 0 6px ${color}60` }} />
      </div>
    </div>
  );
};

const Ring = ({ food, burned, goal }) => {
  const [dash, setDash] = useState(0);
  const net = food - burned, r = 36, cx = 50, cy = 50, circ = 2 * Math.PI * r, over = net > goal;
  useEffect(() => {
    const t = setTimeout(() => setDash(Math.min(net / (goal || 1), 1) * circ), 200);
    return () => clearTimeout(t);
  }, [net, goal, circ]);
  const color = over ? D.red : D.green;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <svg width={100} height={100} viewBox="0 0 100 100">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={D.faint} strokeWidth={6} />
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={6}
          strokeDasharray={`${dash} ${circ}`} strokeDashoffset={circ * 0.25} strokeLinecap="round"
          style={{ transition: "stroke-dasharray 0.9s cubic-bezier(0.4,0,0.2,1)", filter: `drop-shadow(0 0 4px ${color})` }} />
        <text x={cx} y={cy - 4} textAnchor="middle" fontSize={15} fontWeight="800" fill={D.text}>{Math.abs(goal - net)}</text>
        <text x={cx} y={cy + 9} textAnchor="middle" fontSize={8} fill={D.muted} fontWeight="600" letterSpacing="0.05em">{over ? "OVER" : "LEFT"}</text>
      </svg>
      <div style={{ fontSize: 10, color: D.muted, marginTop: 1 }}>
        <span style={{ color: D.green, fontWeight: 600 }}>{food}</span> · <span style={{ color: D.red }}>{burned}</span> burned
      </div>
    </div>
  );
};

const LoadingOverlay = () => {
  const [dots, setDots] = useState(0);
  const [phase, setPhase] = useState(0);
  const phases = ["Analysing input", "Calculating macros", "Almost done"];
  useEffect(() => {
    const d = setInterval(() => setDots(n => (n + 1) % 4), 400);
    const p = setInterval(() => setPhase(n => (n + 1) % phases.length), 1200);
    return () => { clearInterval(d); clearInterval(p); };
  }, []);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", background: D.faint, borderRadius: 12, marginTop: 8 }}>
      <div style={{ position: "relative", width: 28, height: 28, flexShrink: 0 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ position: "absolute", width: 10, height: 10, borderRadius: 2, background: D.text, opacity: 0.15 + i * 0.22, top: i < 2 ? 0 : 16, left: i % 2 === 0 ? 0 : 16, animation: `morphBox 1.2s ease-in-out ${i * 0.15}s infinite` }} />
        ))}
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: D.text }}>{phases[phase]}{".".repeat(dots)}</div>
        <div style={{ height: 3, borderRadius: 2, background: D.border, marginTop: 5, overflow: "hidden" }}>
          <div style={{ height: "100%", borderRadius: 2, background: D.green, animation: "shimmerBar 1.4s ease-in-out infinite" }} />
        </div>
      </div>
    </div>
  );
};

const Chip = ({ label, value, color, icon }) => (
  <div style={{ flex: 1, background: D.faint, borderRadius: 12, padding: "10px 6px", textAlign: "center", border: `1px solid ${D.border}` }}>

      <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: "-0.02em" }}>{title}</div>

// ── SVG Line Chart (actual vs goal) ──────────────────────────────────────────
const LineChart = ({ data, valueKey, goal, color, goalColor = D.amber }) => {
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 100); return () => clearTimeout(t); }, [data]);

  const W = 320, H = 100, PAD = { top: 8, right: 8, bottom: 20, left: 32 };
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;
  const vals = data.map(d => d[valueKey] || 0);
  const maxV = Math.max(...vals, goal || 0, 1) * 1.15;
  const minV = 0;

  const px = (i) => PAD.left + (i / Math.max(data.length - 1, 1)) * innerW;
  const py = (v) => PAD.top + innerH - ((v - minV) / (maxV - minV)) * innerH;

  const linePath = data.map((d, i) => `${i === 0 ? "M" : "L"}${px(i)},${py(d[valueKey] || 0)}`).join(" ");
  const areaPath = linePath + ` L${px(data.length - 1)},${PAD.top + innerH} L${px(0)},${PAD.top + innerH} Z`;
  const goalY = py(goal);

  // Y axis ticks
  const yTicks = [0, Math.round(maxV * 0.5), Math.round(maxV)];

  return (
    <div style={{ overflowX: "auto" }}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
        <defs>
          <linearGradient id={`grad-${valueKey}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.25" />
            <stop offset="100%" stopColor={color} stopOpacity="0.01" />
          </linearGradient>
          <clipPath id={`clip-${valueKey}`}>
            <rect x={PAD.left} y={PAD.top} width={innerW} height={innerH} />
          </clipPath>
        </defs>

        {/* Y grid lines */}
        {yTicks.map(t => (
          <g key={t}>
            <line x1={PAD.left} y1={py(t)} x2={W - PAD.right} y2={py(t)} stroke={D.border} strokeWidth={1} strokeDasharray="3,4" />
            <text x={PAD.left - 4} y={py(t) + 3} textAnchor="end" fontSize={7} fill={D.muted}>{t >= 1000 ? `${(t/1000).toFixed(1)}k` : t}</text>
          </g>
        ))}

        {/* Goal line */}
        {goal > 0 && (
          <g>
            <line x1={PAD.left} y1={goalY} x2={W - PAD.right} y2={goalY} stroke={goalColor} strokeWidth={1.5} strokeDasharray="5,4" opacity={0.7} />
            <text x={W - PAD.right + 2} y={goalY + 3} fontSize={7} fill={goalColor} opacity={0.9}>goal</text>
          </g>
        )}

        {/* Area fill */}
        {ready && data.length > 1 && (
          <path d={areaPath} fill={`url(#grad-${valueKey})`} clipPath={`url(#clip-${valueKey})`} />
        )}

        {/* Line */}
        {data.length > 1 && (
          <path d={linePath} fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
            clipPath={`url(#clip-${valueKey})`}
            style={{ filter: `drop-shadow(0 0 3px ${color}80)` }}
          />
        )}

        {/* Dots */}
        {ready && data.map((d, i) => {
          const v = d[valueKey] || 0;
          const over = goal > 0 && v > goal;
          return (
            <circle key={i} cx={px(i)} cy={py(v)} r={2.5}
              fill={over ? D.red : color} stroke={D.card} strokeWidth={1.5}
              style={{ filter: `drop-shadow(0 0 2px ${color})` }} />
          );
        })}

        {/* X labels */}
        {data.map((d, i) => {
          const every = data.length > 10 ? Math.ceil(data.length / 6) : 1;
          if (i % every !== 0 && i !== data.length - 1) return null;
          return <text key={i} x={px(i)} y={H - 4} textAnchor="middle" fontSize={7} fill={D.muted}>{d.label}</text>;
        })}
      </svg>
    </div>
  );
};

// ── Goal Achievement Radial Chart ─────────────────────────────────────────────
const GoalAchievementChart = ({ data, goals, period }) => {
  const metrics = [
    { key: "cal",     label: "Calories", color: D.amber,  goal: goals.calories, unit: "kcal" },
    { key: "protein", label: "Protein",  color: D.green,  goal: goals.protein,  unit: "g" },
    { key: "carbs",   label: "Carbs",    color: D.blue,   goal: goals.carbs,    unit: "g" },
    { key: "fat",     label: "Fat",      color: D.purple, goal: goals.fat,      unit: "g" },
  ];
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 120); return () => clearTimeout(t); }, [data]);

  // days where goal was met
  const metCounts = {};
  metrics.forEach(m => {
    metCounts[m.key] = data.filter(d => m.goal > 0 && (d[m.key] || 0) >= m.goal * 0.9 && (d[m.key] || 0) <= m.goal * 1.15).length;
  });
  const total = data.length || 1;

  const cx = 80, cy = 80, baseR = 18, gap = 14;
  const rings = metrics.map((m, i) => ({
    ...m,
    r: baseR + i * gap,
    pct: metCounts[m.key] / total,
  }));

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 2 }}>Goal Achievement</div>
      <div style={{ fontSize: 11, color: D.muted, marginBottom: 14 }}>Days within target range</div>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <svg width={160} height={160} viewBox="0 0 160 160">
          {rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const dash = ready ? ring.pct * circ : 0;
            return (
              <g key={ring.key}>
                <circle cx={cx} cy={cy} r={ring.r} fill="none" stroke={D.faint} strokeWidth={8} />
                <circle cx={cx} cy={cy} r={ring.r} fill="none" stroke={ring.color} strokeWidth={8}
                  strokeDasharray={`${dash} ${circ}`} strokeDashoffset={circ * 0.25} strokeLinecap="round"
                  style={{ transition: "stroke-dasharray 1s cubic-bezier(0.4,0,0.2,1)", filter: `drop-shadow(0 0 3px ${ring.color}60)` }} />
              </g>
            );
          })}
          <text x={cx} y={cy - 6} textAnchor="middle" fontSize={18} fontWeight="800" fill={D.text}>
            {Math.round(rings.reduce((s,r) => s + r.pct, 0) / rings.length * 100)}%
          </text>
          <text x={cx} y={cy + 8} textAnchor="middle" fontSize={8} fill={D.muted} letterSpacing="0.05em">OVERALL</text>
        </svg>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 10 }}>
          {rings.map(ring => (
            <div key={ring.key}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: ring.color, boxShadow: `0 0 4px ${ring.color}` }} />
                  <span style={{ fontSize: 11, fontWeight: 600, color: D.text }}>{ring.label}</span>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, color: ring.color }}>{Math.round(ring.pct * 100)}%</span>
              </div>
              <div style={{ height: 3, borderRadius: 2, background: D.faint }}>
                <div style={{ height: 3, borderRadius: 2, background: ring.color, width: `${ring.pct * 100}%`, transition: "width 1s cubic-bezier(0.4,0,0.2,1)" }} />
              </div>
              <div style={{ fontSize: 9, color: D.muted, marginTop: 2 }}>{metCounts[ring.key]} of {total} days on target</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Bar Chart ─────────────────────────────────────────────────────────────────
const BarChart = ({ data, valueKey, goal, color }) => {
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 80); return () => clearTimeout(t); }, [data, valueKey]);
  const max = Math.max(...data.map(d => d[valueKey] || 0), goal || 0, 1);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 80, paddingBottom: 20, position: "relative" }}>
      {goal > 0 && <div style={{ position: "absolute", left: 0, right: 0, bottom: 20 + (goal / max) * 60, borderTop: `1px dashed ${D.amber}60`, zIndex: 1 }} />}
      {data.map((d, i) => {
        const val = d[valueKey] || 0;
        const pct = (val / max) * 60;
        const over = goal > 0 && val > goal;
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, height: "100%", justifyContent: "flex-end" }}>
            <div style={{ width: "100%", borderRadius: "3px 3px 0 0", background: over ? D.red : color, height: ready ? pct : 0, transition: `height 0.6s cubic-bezier(0.4,0,0.2,1) ${i * 0.04}s`, minHeight: ready && val > 0 ? 3 : 0, boxShadow: ready && val > 0 ? `0 -2px 6px ${color}40` : "none" }} />
            <span style={{ fontSize: 8, color: D.muted, textAlign: "center", lineHeight: 1.2 }}>{d.label}</span>
          </div>
        );
      })}
    </div>
  );
};

// ── Data helpers ──────────────────────────────────────────────────────────────
function genCalHistory(entries) {
  const now = new Date();
  const todayKey = now.toDateString();
  const history = [];
  for (let d = 0; d < 365; d++) {
    const date = new Date(now); date.setDate(now.getDate() - d);
    const key = date.toDateString();
    if (key === todayKey) {
      history.push({ date, cal: entries.reduce((s,e)=>s+(e.calories||0),0), burned: entries.reduce((s,e)=>s+(e.burnedCalories||0),0), carbs: entries.reduce((s,e)=>s+(e.carbs||0),0), protein: entries.reduce((s,e)=>s+(e.protein||0),0), fat: entries.reduce((s,e)=>s+(e.fat||0),0) });
    } else {
      const seed = (date.getDate()+1)*(date.getMonth()+1)*(d+7);
      const cal = 1500 + (seed % 900);
      history.push({ date, cal, burned: 100+(seed%400), carbs: Math.round(cal*0.45/4), protein: Math.round(cal*0.25/4), fat: Math.round(cal*0.30/9) });
    }
  }
  return history;
}

function groupCalHistory(history, period) {
  if (period === "weekly") return history.slice(0,7).reverse().map(d => ({ label: d.date.toLocaleDateString("en-US",{weekday:"short"}), ...d }));
  if (period === "monthly") {
    const m = {};
    history.forEach(d => {
      const k = d.date.getFullYear()+"-"+d.date.getMonth();
      if (!m[k]) m[k] = { label: d.date.toLocaleDateString("en-US",{month:"short"}), cal:0,burned:0,carbs:0,protein:0,fat:0,n:0 };
      m[k].cal+=d.cal; m[k].burned+=d.burned; m[k].carbs+=d.carbs; m[k].protein+=d.protein; m[k].fat+=d.fat; m[k].n++;
    });
    return Object.values(m).slice(0,12).reverse().map(x=>({...x,cal:Math.round(x.cal/x.n),burned:Math.round(x.burned/x.n),carbs:Math.round(x.carbs/x.n),protein:Math.round(x.protein/x.n),fat:Math.round(x.fat/x.n)}));
  }
  const y = {};
  history.forEach(d => {
    const k = d.date.getFullYear();
    if (!y[k]) y[k] = { label:String(k), cal:0,burned:0,carbs:0,protein:0,fat:0,n:0 };
    y[k].cal+=d.cal; y[k].burned+=d.burned; y[k].carbs+=d.carbs; y[k].protein+=d.protein; y[k].fat+=d.fat; y[k].n++;
  });
  return Object.values(y).map(x=>({...x,cal:Math.round(x.cal/x.n),burned:Math.round(x.burned/x.n),carbs:Math.round(x.carbs/x.n),protein:Math.round(x.protein/x.n),fat:Math.round(x.fat/x.n)}));
}

function seedWaterHistory() {
  const h = {};
  const now = new Date();
  for (let d = 1; d < 60; d++) {
    const date = new Date(now); date.setDate(now.getDate()-d);
    const seed = (date.getDate()+1)*(date.getMonth()+1)*(d+3);
    h[date.toDateString()] = (2+(seed%8)) * 250; // ml
  }
  return h;
}

const WaterStats = ({ water, waterHistory, goals }) => {
  const [wPeriod, setWPeriod] = useState("weekly");

  const monthMap = {};
  Object.entries(allHistory).forEach(([k,v])=>{ const d=new Date(k),mk=d.getFullYear()+"-"+d.getMonth(); if(!monthMap[mk])monthMap[mk]={label:d.toLocaleDateString("en-US",{month:"short",year:"2-digit"}),total:0,n:0}; monthMap[mk].total+=v; monthMap[mk].n++; });
  const last12 = Object.values(monthMap).slice(-12).map(m=>({ label:m.label, val:+(m.total/m.n).toFixed(1) }));
  const yearMap = {};
  Object.entries(allHistory).forEach(([k,v])=>{ const yr=new Date(k).getFullYear(); if(!yearMap[yr])yearMap[yr]={label:String(yr),total:0,n:0}; yearMap[yr].total+=v; yearMap[yr].n++; });
  const allYears = Object.values(yearMap).map(y=>({ label:y.label, val:+(y.total/y.n).toFixed(1) }));
  const allVals = Object.values(allHistory);
  const avgMl = allVals.length ? Math.round(allVals.reduce((s,v)=>s+v,0)/allVals.length) : 0;

  const maxDay = Math.max(...allVals,1);

        {[{label:"Avg/Day",val:avgMl>=1000?(avgMl/1000).toFixed(1)+"L":avgMl+"ml",unit:""},{label:"Goal Days",val:goalDays,unit:"days"},{label:"Streak",val:streak,unit:"days"},{label:"Best Day",val:maxDay>=1000?(maxDay/1000).toFixed(1)+"L":maxDay+"ml",unit:""}].map(s=>(
          <div key={s.label} style={{ flex:1, background:D.card, border:`1px solid ${D.border}`, borderRadius:12, padding:"10px 6px", textAlign:"center" }}>
            <div style={{ fontSize:13, fontWeight:800, color:D.water }}>{s.val}</div>
            {s.unit && <div style={{ fontSize:8, color:D.muted, marginTop:2, textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600 }}>{s.unit}</div>}

// ── AI Coach ──────────────────────────────────────────────────────────────────
const D_CORAL = "#FB923C";
const D_coralDim = "rgba(251,146,60,0.12)";
const D_coralGlow = "rgba(251,146,60,0.08)";

const COACH_SUGGESTIONS = [
  "What should I eat to hit my protein goal today?",
  "Am I on track to reach my target weight?",
  "Give me a meal plan for tomorrow",
  "How can I improve my macro balance?",
  "What exercises should I do to burn more calories?",
  "Analyze my nutrition this week",
];

const CoachView = ({ entries, goals, weights, heightCm, targetWeight, water }) => {
  const [messages, setMessages] = useState([
    { role: "assistant", content: "Hey! I'm your personal AI health coach 🌿 I know your goals, today's food log, weight history, and hydration. Ask me anything — meal advice, goal tracking, workout tips, or a custom plan.", id: 0 }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [streaming, setStreaming] = useState("");
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, streaming]);

  const buildContext = () => {
    const totals = entries.reduce((a,e)=>({cal:a.cal+(e.calories||0),burned:a.burned+(e.burnedCalories||0),carbs:a.carbs+(e.carbs||0),protein:a.protein+(e.protein||0),fat:a.fat+(e.fat||0)}),{cal:0,burned:0,carbs:0,protein:0,fat:0});
    const currentWeight = weights.length > 0 ? weights[0].weight : null;
    const bmi = currentWeight && heightCm ? (currentWeight / ((parseFloat(heightCm)/100)**2)).toFixed(1) : null;
    return `You are a friendly, expert personal health & nutrition coach. Be concise, warm, and actionable. Use emojis sparingly.

USER PROFILE:
- Height: ${heightCm ? heightCm + "cm" : "not set"}
- Current weight: ${currentWeight ? currentWeight + "kg" : "not logged"}
- Target weight: ${targetWeight ? targetWeight + "kg" : "not set"}
- BMI: ${bmi || "unknown"}
- Weight entries: ${weights.length} logged

DAILY GOALS:
- Calories: ${goals.calories} kcal
- Carbs: ${goals.carbs}g | Protein: ${goals.protein}g | Fat: ${goals.fat}g
- Water: ${goals.water}ml

TODAY'S INTAKE:
- Calories eaten: ${totals.cal} kcal (${Math.round((totals.cal/goals.calories)*100)}% of goal)
- Burned: ${totals.burned} kcal
- Net: ${totals.cal - totals.burned} kcal
- Carbs: ${totals.carbs}g / ${goals.carbs}g
- Protein: ${totals.protein}g / ${goals.protein}g
- Fat: ${totals.fat}g / ${goals.fat}g
- Water: ${water}ml / ${goals.water}ml

FOOD LOG TODAY:
${entries.length === 0 ? "Nothing logged yet." : entries.map(e => `- ${e.name} (${e.quantity}): ${e.type==="exercise"?`burned ${e.burnedCalories} kcal`:`${e.calories} kcal, C:${e.carbs}g P:${e.protein}g F:${e.fat}g`}`).join("\n")}

Respond helpfully based on this data.`;
  };

  const send = async (text) => {
    const userMsg = text || input.trim();
    if (!userMsg || loading) return;
    setInput("");
    const userEntry = { role: "user", content: userMsg, id: Date.now() };
    const history = [...messages, userEntry];
    setMessages(history);
    setLoading(true);
    setStreaming("");

    try {
      const apiMessages = history
        .filter(m => m.id !== 0)
        .map(m => ({ role: m.role, content: m.content }));

      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: buildContext(),
          messages: apiMessages,
          stream: true,
        })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");
        for (const line of lines) {
          if (line.startsWith("data: ")) {
            try {
              const json = JSON.parse(line.slice(6));
              if (json.type === "content_block_delta" && json.delta?.text) {
                full += json.delta.text;
                setStreaming(full);
              }
            } catch {}
          }
        }
      }

      setMessages(prev => [...prev, { role: "assistant", content: full, id: Date.now() }]);
      setStreaming("");
    } catch {
      setMessages(prev => [...prev, { role: "assistant", content: "Sorry, I hit an error. Please try again.", id: Date.now() }]);
      setStreaming("");
    }
    setLoading(false);
  };

  const coralAccent = "#FB923C";
  const coralDim = "rgba(251,146,60,0.12)";

  return (
    <>
      <SectionHead iconEmoji="🤖" iconBg={coralDim} iconColor={coralAccent}
        title="AI Coach" subtitle="Personalised advice based on your data" />

      {/* Chat messages */}
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:12 }}>
        {messages.map((m) => (
          <div key={m.id} style={{ display:"flex", flexDirection:"column", alignItems: m.role==="user" ? "flex-end" : "flex-start" }}>
            {m.role === "assistant" && (
              <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
                <div style={{ width:30, height:30, borderRadius:10, background:coralDim, border:`1px solid ${coralAccent}30`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0, marginTop:2 }}>🤖</div>
                <div style={{ background:D.card, border:`1px solid ${D.border}`, borderRadius:"4px 16px 16px 16px", padding:"10px 14px", maxWidth:"85%", fontSize:13, lineHeight:1.6, color:D.text, whiteSpace:"pre-wrap" }}>
                  {m.content}
                </div>
              </div>
            )}
            {m.role === "user" && (
              <div style={{ background:coralDim, border:`1px solid ${coralAccent}30`, borderRadius:"16px 4px 16px 16px", padding:"10px 14px", maxWidth:"85%", fontSize:13, lineHeight:1.6, color:D.text }}>
                {m.content}
              </div>
            )}
          </div>
        ))}

        {/* Streaming bubble */}
        {streaming && (
          <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
            <div style={{ width:30, height:30, borderRadius:10, background:coralDim, border:`1px solid ${coralAccent}30`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0, marginTop:2 }}>🤖</div>
            <div style={{ background:D.card, border:`1px solid ${coralAccent}40`, borderRadius:"4px 16px 16px 16px", padding:"10px 14px", maxWidth:"85%", fontSize:13, lineHeight:1.6, color:D.text, whiteSpace:"pre-wrap" }}>
              {streaming}<span style={{ display:"inline-block", width:8, height:13, background:coralAccent, marginLeft:2, borderRadius:2, animation:"fadeIn 0.5s ease infinite alternate", verticalAlign:"text-bottom" }} />
            </div>
          </div>
        )}

        {/* Typing indicator */}
        {loading && !streaming && (
          <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
            <div style={{ width:30, height:30, borderRadius:10, background:coralDim, border:`1px solid ${coralAccent}30`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0 }}>🤖</div>
            <div style={{ background:D.card, border:`1px solid ${D.border}`, borderRadius:"4px 16px 16px 16px", padding:"12px 16px", display:"flex", gap:5, alignItems:"center" }}>
              {[0,1,2].map(i=><div key={i} style={{ width:6, height:6, borderRadius:"50%", background:coralAccent, animation:`bounceDot 0.9s ease-in-out ${i*0.18}s infinite` }} />)}
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Quick suggestions */}
      {messages.length <= 1 && (
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, color:D.muted, textTransform:"uppercase", letterSpacing:"0.08em", fontWeight:600, marginBottom:8 }}>Quick questions</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {COACH_SUGGESTIONS.map((s,i) => (
              <button key={i} onClick={() => send(s)}
                style={{ textAlign:"left", padding:"10px 14px", background:D.faint, border:`1px solid ${D.border}`, borderRadius:12, color:D.muted, fontSize:12, cursor:"pointer", transition:"all 0.18s", lineHeight:1.4 }}
                onMouseEnter={e=>{ e.currentTarget.style.background=D.card; e.currentTarget.style.color=D.text; e.currentTarget.style.borderColor=coralAccent+"50"; }}
                onMouseLeave={e=>{ e.currentTarget.style.background=D.faint; e.currentTarget.style.color=D.muted; e.currentTarget.style.borderColor=D.border; }}>
                {s}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Input */}
      <div style={{ display:"flex", gap:8, position:"sticky", bottom:0, paddingBottom:8, paddingTop:4, background:D.bg }}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
          placeholder="Ask your coach anything…" disabled={loading}
          style={{ flex:1, height:46, background:D.card, border:`1px solid ${input?coralAccent+"60":D.border}`, borderRadius:14, color:D.text, fontSize:14, padding:"0 14px", outline:"none", fontFamily:"inherit", transition:"border-color 0.2s" }}
          onFocus={e=>e.target.style.borderColor=coralAccent+"80"}
          onBlur={e=>e.target.style.borderColor=input?coralAccent+"40":D.border} />
        <button onClick={() => send()} disabled={loading||!input.trim()}
          style={{ width:46, height:46, background:!loading&&input.trim()?coralAccent:D.faint, border:"none", borderRadius:14, cursor:loading||!input.trim()?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.25s", flexShrink:0, boxShadow:!loading&&input.trim()?`0 0 12px ${coralAccent}50`:"none", fontSize:20, color:D.bg }}>
          {loading ? <div style={{ display:"flex", gap:3 }}>{[0,1,2].map(i=><div key={i} style={{ width:4,height:4,borderRadius:"50%",background:D.muted,animation:`bounceDot 0.9s ease-in-out ${i*0.18}s infinite` }} />)}</div> : "↑"}
        </button>
      </div>
    </>
  );
};


// ── Calendar View ─────────────────────────────────────────────────────────────
const fuchsia = "#E879F9";
const fuchsiaDim = "rgba(232,121,249,0.12)";
const fuchsiaGlow = "rgba(232,121,249,0.08)";

const CalendarView = ({ logHistory, goals }) => {
  const now = new Date();
  const [curYear, setCurYear]   = useState(now.getFullYear());
  const [curMonth, setCurMonth] = useState(now.getMonth());
  const [selected, setSelected] = useState(null);

  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const firstDOW    = new Date(curYear, curMonth, 1).getDay();
  const monthName   = new Date(curYear, curMonth, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });

  const prevMonth = () => { if(curMonth===0){setCurMonth(11);setCurYear(y=>y-1);}else setCurMonth(m=>m-1); setSelected(null); };
  const nextMonth = () => { if(curMonth===11){setCurMonth(0);setCurYear(y=>y+1);}else setCurMonth(m=>m+1); setSelected(null); };

  const getKey = (y,m,d) => new Date(y,m,d).toDateString();
  const getDayData = (day) => logHistory[getKey(curYear, curMonth, day)] || null;

  const getDotColor = (data) => {
    if (!data || !data.entries || data.entries.length === 0) return null;
    const cal = data.entries.reduce((s,e) => s + (e.calories||0), 0);
    const pct = cal / (goals.calories || 2000);
    if (pct < 0.6)  return D.blue;
    if (pct <= 1.1) return D.green;
    if (pct <= 1.3) return D.amber;
    return D.red;
  };

  const selData    = selected ? getDayData(selected) : null;
  const selEntries = selData?.entries || [];
  const selTotals  = selEntries.reduce((a,e) => ({
    cal:a.cal+(e.calories||0), burned:a.burned+(e.burnedCalories||0),
    carbs:a.carbs+(e.carbs||0), protein:a.protein+(e.protein||0), fat:a.fat+(e.fat||0),
  }), {cal:0,burned:0,carbs:0,protein:0,fat:0});

  const todayKey  = now.toDateString();
  const loggedDays = Array.from({length:daysInMonth},(_,i)=>i+1)
    .map(d=>getDayData(d)).filter(d=>d&&d.entries&&d.entries.length>0);
  const avgCal  = loggedDays.length
    ? Math.round(loggedDays.reduce((s,d)=>s+d.entries.reduce((a,e)=>a+(e.calories||0),0),0)/loggedDays.length) : 0;
  const goalDays = loggedDays.filter(d=>{
    const cal=d.entries.reduce((s,e)=>s+(e.calories||0),0);
    return cal>=goals.calories*0.85&&cal<=goals.calories*1.15;
  }).length;

  return (
    <>
      <SectionHead iconEmoji="📅" iconBg={fuchsiaGlow} iconColor={fuchsia}
        title="Log History" subtitle="Tap any day to review your meals" />

      {/* Month navigator */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14, background:D.card, border:`1px solid ${D.border}`, borderRadius:14, padding:"10px 14px" }}>
        <button onClick={prevMonth} style={{ width:34,height:34,borderRadius:10,background:D.faint,border:`1px solid ${D.border}`,color:D.text,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>‹</button>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontSize:15, fontWeight:800, letterSpacing:"-0.02em" }}>{monthName}</div>
          <div style={{ fontSize:10, color:D.muted, marginTop:2 }}>{loggedDays.length} days logged</div>
        </div>
        <button onClick={nextMonth} disabled={curYear===now.getFullYear()&&curMonth===now.getMonth()}
          style={{ width:34,height:34,borderRadius:10,background:D.faint,border:`1px solid ${D.border}`,color:(curYear===now.getFullYear()&&curMonth===now.getMonth())?D.faint:D.text,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>›</button>
      </div>

      {/* Month stats */}
      <div style={{ display:"flex", gap:8, marginBottom:14 }}>
        {[{label:"Logged",val:loggedDays.length,unit:"days",color:fuchsia},{label:"Avg Cal",val:avgCal||"—",unit:"kcal",color:D.amber},{label:"On Goal",val:goalDays,unit:"days",color:D.green}].map(s=>(
          <div key={s.label} style={{ flex:1, background:D.card, border:`1px solid ${D.border}`, borderRadius:12, padding:"10px 6px", textAlign:"center" }}>
            <div style={{ fontSize:16, fontWeight:800, color:s.color }}>{s.val}</div>
            <div style={{ fontSize:8, color:D.muted, marginTop:1, textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600 }}>{s.unit}</div>
            <div style={{ fontSize:9, color:D.muted, marginTop:1 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{ background:D.card, border:`1px solid ${D.border}`, borderRadius:16, padding:"14px 10px", marginBottom:14 }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", marginBottom:6 }}>
          {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>(
            <div key={d} style={{ textAlign:"center", fontSize:9, color:D.muted, fontWeight:700, padding:"2px 0", textTransform:"uppercase", letterSpacing:"0.06em" }}>{d}</div>
          ))}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:3 }}>
          {Array.from({length:firstDOW}).map((_,i)=><div key={"e"+i} />)}
          {Array.from({length:daysInMonth},(_,i)=>i+1).map(day=>{
            const key=getKey(curYear,curMonth,day), data=getDayData(day);
            const dot=getDotColor(data), isTod=key===todayKey, isSel=selected===day, hasLog=dot!==null;
            return (
              <button key={day} onClick={()=>setSelected(isSel?null:day)}
                style={{ aspectRatio:"1", borderRadius:10, border:`1px solid ${isSel?fuchsia:isTod?D.green+"80":"transparent"}`,
                  background:isSel?fuchsiaDim:isTod?D.green+"15":"transparent",
                  cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2, transition:"all 0.18s" }}>
                <span style={{ fontSize:12, fontWeight:isTod||isSel?800:400, color:isSel?fuchsia:isTod?D.green:D.text, lineHeight:1 }}>{day}</span>
                <div style={{ width:5, height:5, borderRadius:"50%", background:hasLog?dot:"transparent", boxShadow:hasLog?`0 0 4px ${dot}`:"none", transition:"background 0.2s" }} />
              </button>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:10, justifyContent:"center", marginTop:12, flexWrap:"wrap" }}>
          {[{color:D.blue,label:"Under"},{color:D.green,label:"On goal"},{color:D.amber,label:"Slightly over"},{color:D.red,label:"Over"}].map(l=>(
            <div key={l.label} style={{ display:"flex", alignItems:"center", gap:4 }}>
              <div style={{ width:7,height:7,borderRadius:"50%",background:l.color,boxShadow:`0 0 4px ${l.color}` }} />
              <span style={{ fontSize:9, color:D.muted, fontWeight:500 }}>{l.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Selected day detail */}
      {selected && (
        <div style={{ animation:"slideIn 0.25s ease" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
            <div style={{ fontSize:14, fontWeight:700, color:fuchsia }}>
              📅 {new Date(curYear,curMonth,selected).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}
            </div>
            <button onClick={()=>setSelected(null)} style={{ background:"none",border:"none",color:D.muted,fontSize:18,cursor:"pointer" }}>✕</button>
          </div>
          {selEntries.length===0 ? (
            <div style={{ ...card, textAlign:"center", padding:"28px 0", color:D.muted }}>
              <div style={{ fontSize:28, marginBottom:8 }}>🌙</div>
              <div style={{ fontSize:13, fontWeight:500, color:D.text }}>Nothing logged this day</div>
            </div>
          ) : (
            <>
              <div style={{ ...card, marginBottom:10 }}>
                <div style={{ display:"flex", gap:6 }}>
                  {[{label:"Calories",val:selTotals.cal,color:D.amber},{label:"Protein",val:selTotals.protein+"g",color:D.green},{label:"Carbs",val:selTotals.carbs+"g",color:D.blue},{label:"Fat",val:selTotals.fat+"g",color:D.purple}].map(s=>(
                    <div key={s.label} style={{ flex:1, textAlign:"center", background:D.faint, borderRadius:10, padding:"8px 4px" }}>
                      <div style={{ fontSize:13, fontWeight:800, color:s.color }}>{s.val}</div>
                      <div style={{ fontSize:8, color:D.muted, marginTop:1 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
                {selTotals.burned>0 && <div style={{ marginTop:8, fontSize:11, color:D.red, textAlign:"center" }}>🏃 {selTotals.burned} kcal burned · Net {selTotals.cal-selTotals.burned} kcal</div>}
              </div>
              {selEntries.map((e,i)=>(
                <div key={i} style={{ ...card, display:"flex", gap:10, alignItems:"flex-start", padding:"10px 12px", marginBottom:6 }}>
                  <div style={{ width:34,height:34,borderRadius:10,background:e.type==="exercise"?D.redDim:D.greenDim,border:`1px solid ${e.type==="exercise"?D.red:D.green}30`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16 }}>
                    {e.type==="exercise"?"🏃":"🍽️"}
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:600, fontSize:13 }}>{e.name}</div>
                    <div style={{ fontSize:10, color:D.muted, marginTop:1 }}>{e.quantity} · {e.time}</div>
                    <div style={{ display:"flex", gap:4, marginTop:5, flexWrap:"wrap" }}>
                      {e.type==="exercise"
                        ? <span style={{ fontSize:10,color:D.red,background:D.redDim,padding:"2px 7px",borderRadius:5,fontWeight:600 }}>−{e.burnedCalories} kcal</span>
                        : <>
                            <span style={{ fontSize:10,color:D.amber,background:D.amberDim,padding:"2px 7px",borderRadius:5,fontWeight:700 }}>{e.calories} kcal</span>
                            <span style={{ fontSize:10,color:D.blue,background:D.blueDim,padding:"2px 7px",borderRadius:5 }}>C {e.carbs}g</span>
                            <span style={{ fontSize:10,color:D.green,background:D.greenDim,padding:"2px 7px",borderRadius:5 }}>P {e.protein}g</span>
                            <span style={{ fontSize:10,color:D.purple,background:D.purpleDim,padding:"2px 7px",borderRadius:5 }}>F {e.fat}g</span>
                          </>}
                    </div>
                  </div>
                </div>
              ))}
            </>
          )}
        </div>
      )}

      {loggedDays.length===0&&!selected&&(
        <div style={{ textAlign:"center", padding:"32px 0", color:D.muted }}>
          <div style={{ fontSize:36, marginBottom:10 }}>📭</div>
          <div style={{ fontSize:14, fontWeight:500, color:D.text }}>No logs this month</div>
          <div style={{ fontSize:12, marginTop:4 }}>Start logging meals in the Diary tab</div>
        </div>
      )}
    </>
  );
};

                  <div key={label} style={{ display:"flex",alignItems:"center",gap:4,background:D.faint,border:`1px solid ${D.border}`,borderRadius:8,padding:"4px 8px",fontSize:10,color:D.muted,fontWeight:600 }}>

                    <div style={{ fontSize:10, color:D.muted, marginBottom:4, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Age</div>
                    <input type="number" placeholder="e.g. 25" value={tmpProfile.age} onChange={e=>setTmpProfile(p=>({...p,age:e.target.value}))}
                      style={{ ...inpStyle, height:40, borderRadius:10, fontSize:13 }} onFocus={e=>e.target.style.borderColor=D.amber+"80"} onBlur={e=>e.target.style.borderColor=D.border} />
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:D.muted, marginBottom:4, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Sex</div>
                    <div style={{ display:"flex", gap:4 }}>
                      {["male","female"].map(s=>(
                        <button key={s} onClick={()=>setTmpProfile(p=>({...p,sex:s}))}
                          style={{ flex:1, height:40, background:tmpProfile.sex===s?D.amberDim:D.faint, border:`1px solid ${tmpProfile.sex===s?D.amber+"60":D.border}`, borderRadius:10, color:tmpProfile.sex===s?D.amber:D.muted, fontSize:12, cursor:"pointer", fontWeight:tmpProfile.sex===s?700:400, textTransform:"capitalize" }}>

                    <input type="number" placeholder="e.g. 175" value={tmpProfile.height} onChange={e=>setTmpProfile(p=>({...p,height:e.target.value}))}
                      style={{ ...inpStyle, height:40, borderRadius:10, fontSize:13 }} onFocus={e=>e.target.style.borderColor=D.amber+"80"} onBlur={e=>e.target.style.borderColor=D.border} />

                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:D.muted, marginBottom:4, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Weight (kg)</div>
                    <input type="number" step="0.1" placeholder="e.g. 70" value={tmpProfile.weight} onChange={e=>setTmpProfile(p=>({...p,weight:e.target.value}))}
                      style={{ ...inpStyle, height:40, borderRadius:10, fontSize:13 }} onFocus={e=>e.target.style.borderColor=D.amber+"80"} onBlur={e=>e.target.style.borderColor=D.border} />

                </div>

                        <div style={{ fontSize:12, fontWeight:tmpProfile.goal===v?700:500, color:tmpProfile.goal===v?D.amber:D.text }}>{label}</div>
                        <div style={{ fontSize:10, color:D.muted, marginTop:2 }}>{desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Calculate button */}
                {calcError && <div style={{ fontSize:12, color:D.red, background:D.redDim, borderRadius:8, padding:"8px 12px", border:`1px solid ${D.red}30` }}>{calcError}</div>}

                {calcResult && (
                  <div style={{ background:D.amberDim, border:`1px solid ${D.amber}40`, borderRadius:12, padding:"12px 14px" }}>

                    <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>

                        { k:"calories", label:"Calories", unit:"kcal", col:D.amber },
                        { k:"protein",  label:"Protein",  unit:"g",    col:D.green },
                        { k:"carbs",    label:"Carbs",    unit:"g",    col:D.blue },
                        { k:"fat",      label:"Fat",      unit:"g",    col:D.purple },

                        <div key={k} style={{ flex:"1 1 calc(33% - 6px)", background:D.card, border:`1px solid ${D.border}`, borderRadius:10, padding:"8px 6px", textAlign:"center" }}>
                          <div style={{ fontSize:15, fontWeight:800, color:col }}>{calcResult[k]}</div>
                          <div style={{ fontSize:9, color:D.muted, textTransform:"uppercase", letterSpacing:"0.05em" }}>{unit}</div>
                          <div style={{ fontSize:9, color:D.muted, marginTop:1 }}>{label}</div>
                        </div>
                      ))}
                    </div>
                    {calcResult.reasoning && <div style={{ fontSize:11, color:D.muted, lineHeight:1.6, marginBottom:10 }}>{calcResult.reasoning}</div>}
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={()=>{ setGoals({calories:calcResult.calories,carbs:calcResult.carbs,protein:calcResult.protein,fat:calcResult.fat,water:calcResult.water}); setProfile({...tmpProfile}); setEditingGoalProfile(false); setCalcResult(null); }}
                        style={{ flex:1, padding:"10px 0", background:D.amber, border:"none", borderRadius:10, color:D.bg, fontWeight:700, fontSize:13, cursor:"pointer", boxShadow:`0 0 12px ${D.amber}40` }}>

                      </button>
                      <button onClick={()=>setCalcResult(null)} style={{ padding:"10px 14px", background:D.faint, border:`1px solid ${D.border}`, borderRadius:10, color:D.muted, fontSize:13, cursor:"pointer" }}>✕</button>
                    </div>
                  </div>
                )}

                {!calcResult && (
                  <button
                    disabled={calcLoading || !tmpProfile.age || !tmpProfile.height || !tmpProfile.weight}

                      setCalcLoading(true); setCalcError(""); setCalcResult(null);
                      try {
                        const r = await calcPersonalisedGoals(tmpProfile);
                        setCalcResult(r);
                      } catch(e) { setCalcError("Couldn't calculate goals. Please check your inputs and try again."); }
                      setCalcLoading(false);
                    }}
                    style={{ width:"100%", padding:"12px 0", background:(!tmpProfile.age||!tmpProfile.height||!tmpProfile.weight||calcLoading)?D.faint:D.amber, border:"none", borderRadius:12, color:(!tmpProfile.age||!tmpProfile.height||!tmpProfile.weight||calcLoading)?D.muted:D.bg, fontWeight:700, fontSize:14, cursor:(!tmpProfile.age||!tmpProfile.height||!tmpProfile.weight||calcLoading)?"default":"pointer", boxShadow:(!tmpProfile.age||!tmpProfile.height||!tmpProfile.weight||calcLoading)?"none":`0 0 16px ${D.amber}40`, transition:"all 0.2s" }}>
                    {calcLoading
                      ? <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><div style={{ display:"flex", gap:3 }}>{[0,1,2].map(i=><div key={i} style={{ width:5,height:5,borderRadius:"50%",background:D.muted,animation:`bounceDot 0.9s ease-in-out ${i*0.18}s infinite` }} />)}</div> Calculating…</span>
                      : "🧬 Calculate My Goals"}
                  </button>
                )}

                {/* Save profile without calculating */}
                <button onClick={()=>{ setProfile({...tmpProfile}); setEditingGoalProfile(false); setCalcResult(null); }}
                  style={{ width:"100%", padding:"9px 0", background:"transparent", border:`1px solid ${D.border}`, borderRadius:12, color:D.muted, fontWeight:600, fontSize:12, cursor:"pointer" }}>
                  Save Profile Only
                </button>
              </div>

          {[["calories","🔥",D.amber,D.amberDim,"kcal","Daily energy target"],["carbs","🍞",D.blue,D.blueDim,"g","Carbohydrates"],["protein","🥩",D.green,D.greenDim,"g","Muscle building"],["fat","🫧",D.purple,D.purpleDim,"g","Healthy fats"],["water","💧",D.water,D.waterDim,"ml","Hydration goal"]].map(([k,ic,col,dim,unit,desc])=>(
            <div key={k} style={{ ...card, display:"flex", alignItems:"center", gap:12, marginBottom:8, padding:"12px 14px" }}>
