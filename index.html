                <div style={{ fontSize:14, fontWeight:600, textTransform:"capitalize" }}>{k}</div>
                <div style={{ fontSize:11, color:D.muted }}>{desc}</div>
              </div>
              {editing
                ? <input type="number" value={tmp[k]} onChange={e=>setTmp(g=>({...g,[k]:+e.target.value}))} style={{ width:76, textAlign:"right", fontSize:14, background:D.surface, border:`1px solid ${D.border}`, borderRadius:8, color:D.text, padding:"4px 8px", outline:"none", fontFamily:"inherit" }} />
                : <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:col }}>{goals[k]}</div>
                    <div style={{ fontSize:10, color:D.muted }}>{unit}</div>
                  </div>}
            </div>
          ))}

          {editing && (
            <button onClick={()=>{ setGoals({...tmp}); setEditing(false); }} style={{ width:"100%", padding:12, background:D.amber, border:"none", borderRadius:12, color:D.bg, fontWeight:700, fontSize:14, cursor:"pointer", marginTop:4, boxShadow:`0 0 16px ${D.amber}40` }}>
              ✓ Save goals
            </button>
          )}

          <div style={{ ...card, marginTop:16 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
              <span style={{ fontSize:16 }}>📊</span>
              <span style={{ fontSize:12, color:D.muted, textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:600 }}>Today vs goal</span>
            </div>
            {[["Calories","🔥",totals.cal,goals.calories,"kcal",D.amber],["Carbs","🍞",totals.carbs,goals.carbs,"g",D.blue],["Protein","🥩",totals.protein,goals.protein,"g",D.green],["Fat","🫧",totals.fat,goals.fat,"g",D.purple]].map(([k,ic,v,g,u,c])=>(
              <div key={k} style={{ marginBottom:12 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:13 }}>{ic}</span>
                    <span style={{ fontSize:13, fontWeight:500 }}>{k}</span>
                  </div>
                  <span style={{ fontSize:12 }}><span style={{ color:c, fontWeight:700 }}>{v}</span><span style={{ color:D.muted }}>/{g}{u}</span></span>
                </div>
                <div style={{ height:5, borderRadius:3, background:D.faint }}>
                  <div style={{ height:5, borderRadius:3, background:c, width:`${Math.min((v/(g||1))*100,100)}%`, transition:"width 0.7s cubic-bezier(0.4,0,0.2,1)", boxShadow:`0 0 5px ${c}60` }} />
                </div>
              </div>
            ))}
          </div>
        </>)}

        {/* ── WEIGHT ── */}
        {view === "weight" && (() => {
          const currentW = weights.length > 0 ? weights[0].weight : null;
          const h = parseFloat(heightCm);
          const bmi = currentW && h > 0 ? currentW / ((h/100)**2) : null;
          const bmiRounded = bmi ? +bmi.toFixed(1) : null;
          const getBmiCat = (b) => {
            if (!b) return null;
            if (b < 18.5) return { label:"Underweight", color:"#60A5FA", emoji:"🔵" };
            if (b < 25)   return { label:"Normal",      color:D.green,   emoji:"🟢" };
            if (b < 30)   return { label:"Overweight",  color:D.amber,   emoji:"🟡" };
            return               { label:"Obese",        color:D.red,     emoji:"🔴" };
          };
          const bmiCat = getBmiCat(bmiRounded);
          const bmiPct = bmi ? Math.min(Math.max((bmi-10)/(40-10),0),1) : null;
          const tw = parseFloat(targetWeight);
          const toGo = currentW && tw ? +(currentW-tw).toFixed(1) : null;
          const targetBmi = tw && h > 0 ? +(tw/((h/100)**2)).toFixed(1) : null;
          const progressPct = (weights.length >= 2 && tw) ? (() => {
            const start = weights[weights.length-1].weight;
            const total = start - tw, done = start - currentW;
            return total===0?100:Math.min(Math.max((done/total)*100,0),100);
          })() : null;

          // Weight line chart data
          const weightChartData = [...weights].reverse().map((w,i)=>({ label: i===0||i===weights.length-1?w.date.split("/").slice(0,2).join("/"):"", val: w.weight }));

          return (<>
            <SectionHead iconEmoji="⚖️" iconBg={D.purpleGlow} iconColor={D.purple}
              title="Weight Tracker" subtitle={weights.length>0?`${weights.length} entries logged`:"Track your progress"}
              action={
                <button onClick={()=>{ setEditingProfile(p=>!p); setTmpHeight(heightCm); setTmpTarget(targetWeight); }}
                  style={{ background:editingProfile?D.faint:D.purpleDim, border:`1px solid ${editingProfile?D.border:D.purple+"50"}`, borderRadius:8, padding:"5px 12px", color:editingProfile?D.muted:D.purple, fontSize:12, cursor:"pointer", fontWeight:600 }}>
                  {editingProfile?"Done":"✏️ Profile"}
                </button>
              } />

            {editingProfile && (
              <div style={{ ...card, borderColor:D.purple+"40", marginBottom:14 }}>
                <div style={{ fontSize:12, color:D.muted, textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:12, fontWeight:600 }}>Your Profile</div>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:11, color:D.muted, marginBottom:5 }}>Height (cm)</div>
                    <input type="number" placeholder="e.g. 170" value={tmpHeight} onChange={e=>setTmpHeight(e.target.value)}
                      style={{ ...inpStyle, height:40, borderRadius:10 }} onFocus={e=>e.target.style.borderColor=D.purple+"80"} onBlur={e=>e.target.style.borderColor=D.border} />
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:11, color:D.muted, marginBottom:5 }}>Target Weight (kg)</div>
                    <input type="number" step="0.1" placeholder="e.g. 65" value={tmpTarget} onChange={e=>setTmpTarget(e.target.value)}
                      style={{ ...inpStyle, height:40, borderRadius:10 }} onFocus={e=>e.target.style.borderColor=D.purple+"80"} onBlur={e=>e.target.style.borderColor=D.border} />
                  </div>
                </div>
                <button onClick={()=>{ setHeightCm(tmpHeight); setTargetWeight(tmpTarget); setEditingProfile(false); }}
                  style={{ width:"100%", padding:"10px 0", background:D.purple, border:"none", borderRadius:10, color:D.bg, fontWeight:700, fontSize:13, cursor:"pointer", boxShadow:`0 0 12px ${D.purple}40` }}>
                  ✓ Save Profile
                </button>
              </div>
            )}

            {/* BMI Card */}
            {bmi && bmiCat && (
              <div style={{ ...card, marginBottom:14 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
                  <div>
                    <div style={{ fontSize:11, color:D.muted, textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:4, fontWeight:600 }}>Body Mass Index</div>
                    <div style={{ display:"flex", alignItems:"baseline", gap:6 }}>
                      <span style={{ fontSize:38, fontWeight:800, color:bmiCat.color, lineHeight:1, textShadow:`0 0 12px ${bmiCat.color}60` }}>{bmiRounded}</span>
                      <span style={{ fontSize:12, color:D.muted }}>kg/m²</span>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:5 }}>
                      <span style={{ fontSize:14 }}>{bmiCat.emoji}</span>
                      <span style={{ fontSize:13, fontWeight:700, color:bmiCat.color }}>{bmiCat.label}</span>
                    </div>
                  </div>
                  <svg width={110} height={58} viewBox="0 0 110 58">
                    {[{x:0,w:24,c:"#60A5FA"},{x:24,w:28,c:D.green},{x:52,w:28,c:D.amber},{x:80,w:30,c:D.red}].map((s,i)=>(
                      <rect key={i} x={s.x} y={8} width={s.w} height={24} rx={i===0?5:i===3?5:0} fill={s.c+"30"} />
                    ))}
                    {[24,52,80].map(x=><line key={x} x1={x} y1={8} x2={x} y2={32} stroke={D.border} strokeWidth={1}/>)}
                    {[{x:12,t:"Under"},{x:38,t:"Normal"},{x:66,t:"Over"},{x:95,t:"Obese"}].map((l,i)=>(
                      <text key={i} x={l.x} y={50} textAnchor="middle" fontSize={7} fill={D.muted} fontWeight="600">{l.t}</text>
                    ))}
                    {bmiPct !== null && <>
                      <line x1={bmiPct*110} y1={4} x2={bmiPct*110} y2={34} stroke={bmiCat.color} strokeWidth={2.5} strokeLinecap="round"/>
                      <circle cx={bmiPct*110} cy={4} r={3.5} fill={bmiCat.color} style={{ filter:`drop-shadow(0 0 3px ${bmiCat.color})` }}/>
                    </>}
                  </svg>
                </div>
                <div style={{ display:"flex", gap:5 }}>
                  {[["<18.5","Underweight","#60A5FA"],["18.5–25","Normal",D.green],["25–30","Overweight",D.amber],[">30","Obese",D.red]].map(([range,label,color])=>(
                    <div key={label} style={{ flex:1, textAlign:"center", padding:"6px 3px", borderRadius:10, background:bmiCat.label===label?color+"20":D.faint, border:`1px solid ${bmiCat.label===label?color+"60":D.border}` }}>
                      <div style={{ fontSize:9, fontWeight:700, color:bmiCat.label===label?color:D.muted }}>{range}</div>
                      <div style={{ fontSize:8, color:D.muted, marginTop:1 }}>{label}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {!heightCm && currentW && (
              <div style={{ ...card, display:"flex", alignItems:"center", gap:12, marginBottom:14, borderColor:D.purple+"40", background:D.purpleDim }}>
                <span style={{ fontSize:24 }}>📏</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600 }}>Add your height for BMI</div>
                  <div style={{ fontSize:11, color:D.muted, marginTop:2 }}>Tap "Profile" above to set height & target</div>
                </div>
              </div>
            )}

            {/* Target Goal */}
            {tw > 0 && currentW && (
              <div style={{ ...card, marginBottom:14 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:16 }}>🎯</span>
                    <span style={{ fontSize:13, fontWeight:700 }}>Target Goal</span>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <span style={{ fontSize:16, fontWeight:800, color:D.purple }}>{tw} <span style={{ fontSize:11, color:D.muted, fontWeight:400 }}>kg</span></span>
                    {targetBmi && <div style={{ fontSize:10, color:D.muted }}>BMI {targetBmi}</div>}
                  </div>
                </div>
                {toGo !== null && (<>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:D.muted, marginBottom:6 }}>
                    <span>Current: <b style={{ color:D.text }}>{currentW} kg</b></span>
                    <span style={{ color:toGo===0?D.green:D.amber, fontWeight:600 }}>{toGo===0?"🎉 Goal reached!":toGo>0?`${toGo} kg to lose`:`${Math.abs(toGo)} kg to gain`}</span>
                  </div>
                  <div style={{ height:8, borderRadius:4, background:D.faint, overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:4, background:toGo===0?D.green:D.purple, width:`${progressPct??0}%`, transition:"width 0.9s cubic-bezier(0.4,0,0.2,1)", boxShadow:`0 0 8px ${D.purple}60` }} />
                  </div>
                  {progressPct!==null && <div style={{ fontSize:10, color:D.muted, marginTop:5, textAlign:"right", fontWeight:600 }}>{progressPct.toFixed(0)}% of the way there</div>}
                  <div style={{ display:"flex", gap:8, marginTop:10 }}>
                    <div style={{ flex:1, background:D.faint, borderRadius:10, padding:"8px 6px", textAlign:"center" }}>
                      <div style={{ fontSize:14, fontWeight:700, color:D.purple }}>{currentW}</div>
                      <div style={{ fontSize:9, color:D.muted, marginTop:1, fontWeight:600 }}>CURRENT kg</div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", fontSize:18, color:D.muted }}>→</div>
                    <div style={{ flex:1, background:D.faint, borderRadius:10, padding:"8px 6px", textAlign:"center" }}>
                      <div style={{ fontSize:14, fontWeight:700, color:toGo===0?D.green:D.amber }}>{tw}</div>
                      <div style={{ fontSize:9, color:D.muted, marginTop:1, fontWeight:600 }}>TARGET kg</div>
                    </div>
                  </div>
                </>)}
              </div>
            )}

            {/* Weight trend line chart */}
            {weights.length >= 2 && (
              <div style={{ ...card, marginBottom:14 }}>
                <div style={{ fontSize:13, fontWeight:700, marginBottom:2 }}>Weight Trend</div>
                <div style={{ fontSize:11, color:D.muted, marginBottom:10 }}>
                  {tw>0 ? `Target: ${tw} kg` : "Your progress over time"}
                </div>
                <LineChart
                  data={weightChartData}
                  valueKey="val"
                  goal={tw || 0}
                  color={D.purple}
                  goalColor={D.amber}
                />
                {tw>0 && (
                  <div style={{ display:"flex", gap:14, marginTop:8 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <div style={{ width:16,height:2,background:D.purple,borderRadius:1,boxShadow:`0 0 4px ${D.purple}` }} />
                      <span style={{ fontSize:10, color:D.muted }}>Weight</span>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <div style={{ width:16,height:2,background:D.amber,borderRadius:1,opacity:0.7,backgroundImage:`repeating-linear-gradient(90deg,${D.amber} 0px,${D.amber} 4px,transparent 4px,transparent 8px)` }} />
                      <span style={{ fontSize:10, color:D.muted }}>Target ({tw} kg)</span>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Stats strip */}
            {weights.length >= 2 && (() => {
              const first=weights[weights.length-1].weight, last=weights[0].weight;
              const diff=last-first, down=diff<0;
              return (
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  {[{label:"Current",val:`${last}kg`,color:D.purple,icon:"⚖️"},{label:"Change",val:`${down?"":"+"}${diff.toFixed(1)}kg`,color:down?D.green:D.red,icon:down?"📉":"📈"},{label:"Start",val:`${first}kg`,color:D.muted,icon:"🏁"}].map(({label,val,color,icon})=>(
                    <div key={label} style={{ flex:1, background:D.card, border:`1px solid ${D.border}`, borderRadius:12, padding:"10px 8px", textAlign:"center" }}>
                      <span style={{ fontSize:14, display:"block", marginBottom:4 }}>{icon}</span>
                      <div style={{ fontSize:14, fontWeight:700, color }}>{val}</div>
                      <div style={{ fontSize:10, color:D.muted, marginTop:2, textTransform:"uppercase", letterSpacing:"0.04em", fontWeight:600 }}>{label}</div>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Log input */}
            <div style={{ display:"flex", gap:8, marginBottom:14 }}>
              <div style={{ flex:1, position:"relative" }}>
                <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:15, color:D.muted, pointerEvents:"none" }}>⚖️</span>
                <input type="number" step="0.1" placeholder="Enter weight (kg)" value={wInput}
                  onChange={e=>setWInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&wInput&&(setWeights(w=>[{weight:+wInput,date:new Date().toLocaleDateString(),id:Date.now()},...w]),setWInput(""))}
                  style={{ ...inpStyle, paddingLeft:36 }}
                  onFocus={e=>e.target.style.borderColor=D.purple+"80"} onBlur={e=>e.target.style.borderColor=D.border} />
              </div>
              <button onClick={()=>{ if(!wInput)return; setWeights(w=>[{weight:+wInput,date:new Date().toLocaleDateString(),id:Date.now()},...w]); setWInput(""); }} style={{ height:44, padding:"0 18px", background:D.purple, border:"none", borderRadius:12, color:D.bg, fontWeight:700, cursor:"pointer", fontSize:14, boxShadow:`0 0 10px ${D.purple}40` }}>Log</button>
            </div>

            {weights.length===0 && (
              <div style={{ textAlign:"center", padding:"36px 0", color:D.muted }}>
                <div style={{ width:56,height:56,borderRadius:18,background:D.purpleGlow,border:`1px solid ${D.purple}30`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:28 }}>⚖️</div>
                <div style={{ fontSize:14, fontWeight:500, marginBottom:4, color:D.text }}>No entries yet</div>
                <div style={{ fontSize:12 }}>Log your first weight to get started</div>
              </div>
            )}

            {weights.map((w,i)=>(
              <div key={w.id} style={{ ...card, display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, padding:"12px 14px", animation:i===0?"entryIn 0.3s ease":"none" }}>
                <div style={{ display:"flex", alignItems:"center", gap:11 }}>
                  <div style={{ width:38,height:38,borderRadius:11,background:D.purpleGlow,border:`1px solid ${D.purple}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18 }}>⚖️</div>
                  <div>
                    <div style={{ fontWeight:700, fontSize:16 }}>{w.weight} <span style={{ fontSize:12, color:D.muted, fontWeight:400 }}>kg</span></div>
                    <div style={{ fontSize:11, color:D.muted }}>{w.date}</div>
                  </div>
                </div>
                {i<weights.length-1&&(()=>{ const d=w.weight-weights[i+1].weight, dn=d<0; return (
                  <div style={{ fontSize:13, fontWeight:600, color:dn?D.green:D.red, background:(dn?D.greenDim:D.redDim), padding:"5px 10px", borderRadius:9, display:"flex", alignItems:"center", gap:4 }}>
                    <span>{dn?"📉":"📈"}</span>{dn?"":"+"}{d.toFixed(1)}
                  </div>
                ); })()}
              </div>
            ))}
          </>);
        })()}

        {/* ── WATER ── */}
        {view === "water" && (<>
          <SectionHead iconEmoji="💧" iconBg={D.waterGlow} iconColor={D.water}
            title="Water Tracker" subtitle={`${water}ml of ${goals.water}ml today`} />

          {/* ── Personalised Water Goal Card ── */}
          <div style={{ ...card, border:`1px solid ${D.water}30`, background:`linear-gradient(135deg,${D.card},${D.waterGlow})`, marginBottom:16 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom: waterCalcOpen ? 14 : 0 }}>
              <div style={{ width:38,height:38,borderRadius:12,background:D.waterDim,border:`1px solid ${D.water}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0 }}>🧬</div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:700 }}>Personalise My Water Goal</div>
                <div style={{ fontSize:11, color:D.muted }}>
                  {waterCalcResult
                    ? `${waterCalcResult.totalMl} ml/day`
                    : "Based on weight, climate & activity"}
                </div>
              </div>
              <button onClick={()=>{ setWaterCalcOpen(o=>!o); setWaterCalcResult(null); setWaterCalcError(""); }}
                style={{ background:waterCalcOpen?D.faint:D.waterDim, border:`1px solid ${waterCalcOpen?D.border:D.water+"50"}`, borderRadius:8, padding:"5px 10px", color:waterCalcOpen?D.muted:D.water, fontSize:11, cursor:"pointer", fontWeight:600, flexShrink:0 }}>
                {waterCalcOpen?"Close":"Set up"}
              </button>
            </div>

            {waterCalcOpen && (
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>

                {/* Weight + Sex */}
                <div style={{ display:"flex", gap:8 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:D.muted, marginBottom:4, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Weight (kg)</div>
                    <input type="number" step="0.1" placeholder="e.g. 70"
                      value={waterProfile.weight}
                      onChange={e=>setWaterProfile(p=>({...p,weight:e.target.value}))}
                      style={{ ...inpStyle, height:40, borderRadius:10, fontSize:13 }}
                      onFocus={e=>e.target.style.borderColor=D.water+"80"} onBlur={e=>e.target.style.borderColor=D.border} />
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:D.muted, marginBottom:4, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Sex</div>
                    <div style={{ display:"flex", gap:4, height:40 }}>
                      {["male","female"].map(s=>(
                        <button key={s} onClick={()=>setWaterProfile(p=>({...p,sex:s}))}
                          style={{ flex:1, height:40, background:waterProfile.sex===s?D.waterDim:D.faint, border:`1px solid ${waterProfile.sex===s?D.water+"60":D.border}`, borderRadius:10, color:waterProfile.sex===s?D.water:D.muted, fontSize:12, cursor:"pointer", fontWeight:waterProfile.sex===s?700:400 }}>
                          {s==="male"?"♂":"♀"} {s.charAt(0).toUpperCase()+s.slice(1)}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Activity */}
                <div>
                  <div style={{ fontSize:10, color:D.muted, marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Activity Level</div>
                  <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                    {[
                      { v:"sedentary", label:"Sedentary", icon:"🪑" },
                      { v:"lightly active", label:"Light", icon:"🚶" },
                      { v:"moderately active", label:"Moderate", icon:"🏃" },
                      { v:"very active", label:"Very Active", icon:"💪" },
                      { v:"athlete", label:"Athlete", icon:"🏆" },
                    ].map(({v,label,icon})=>(
                      <button key={v} onClick={()=>setWaterProfile(p=>({...p,activity:v}))}
                        style={{ flex:"1 1 calc(33% - 4px)", padding:"8px 4px", background:waterProfile.activity===v?D.waterDim:D.faint, border:`1px solid ${waterProfile.activity===v?D.water+"60":D.border}`, borderRadius:10, cursor:"pointer", textAlign:"center" }}>
                        <div style={{ fontSize:16 }}>{icon}</div>
                        <div style={{ fontSize:10, fontWeight:waterProfile.activity===v?700:400, color:waterProfile.activity===v?D.water:D.muted, marginTop:2 }}>{label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Climate */}
                <div>
                  <div style={{ fontSize:10, color:D.muted, marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Climate / Environment</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
                    {[
                      { v:"temperate",    label:"Temperate",     icon:"🌤️", desc:"Mild, comfortable" },
                      { v:"hot and humid",label:"Hot & Humid",   icon:"🌧️", desc:"Tropics, monsoon" },
                      { v:"hot and dry",  label:"Hot & Dry",     icon:"🏜️", desc:"Desert, arid heat" },
                      { v:"cold",         label:"Cold",          icon:"❄️", desc:"Winter, AC-heavy" },
                    ].map(({v,label,icon,desc})=>(
                      <button key={v} onClick={()=>setWaterProfile(p=>({...p,climate:v}))}
                        style={{ padding:"10px 8px", background:waterProfile.climate===v?D.waterDim:D.faint, border:`1px solid ${waterProfile.climate===v?D.water+"60":D.border}`, borderRadius:12, cursor:"pointer", textAlign:"center" }}>
                        <div style={{ fontSize:20, marginBottom:3 }}>{icon}</div>
                        <div style={{ fontSize:11, fontWeight:waterProfile.climate===v?700:500, color:waterProfile.climate===v?D.water:D.text }}>{label}</div>
                        <div style={{ fontSize:9, color:D.muted, marginTop:1 }}>{desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Exercise today */}
                <div>
                  <div style={{ fontSize:10, color:D.muted, marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Exercise Today</div>
                  <div style={{ display:"flex", gap:4 }}>
                    {[
                      { v:"none",    label:"None",       icon:"😴" },
                      { v:"light <30min", label:"Light", icon:"🚶" },
                      { v:"moderate 30-60min", label:"Moderate", icon:"🏃" },
                      { v:"intense >60min", label:"Intense",    icon:"🔥" },
                    ].map(({v,label,icon})=>(
                      <button key={v} onClick={()=>setWaterProfile(p=>({...p,exercises:v}))}
                        style={{ flex:1, padding:"8px 4px", background:waterProfile.exercises===v?D.waterDim:D.faint, border:`1px solid ${waterProfile.exercises===v?D.water+"60":D.border}`, borderRadius:10, cursor:"pointer", textAlign:"center" }}>
                        <div style={{ fontSize:16 }}>{icon}</div>
                        <div style={{ fontSize:9, fontWeight:waterProfile.exercises===v?700:400, color:waterProfile.exercises===v?D.water:D.muted, marginTop:2 }}>{label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Pregnancy */}
                <div>
                  <div style={{ fontSize:10, color:D.muted, marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Additional Needs</div>
                  <div style={{ display:"flex", gap:4 }}>
                    {[
                      { v:"no",          label:"None" },
                      { v:"pregnant",    label:"Pregnant" },
                      { v:"breastfeeding", label:"Breastfeeding" },
                    ].map(({v,label})=>(
                      <button key={v} onClick={()=>setWaterProfile(p=>({...p,pregnant:v}))}
                        style={{ flex:1, height:36, background:waterProfile.pregnant===v?D.waterDim:D.faint, border:`1px solid ${waterProfile.pregnant===v?D.water+"60":D.border}`, borderRadius:10, cursor:"pointer", fontSize:11, fontWeight:waterProfile.pregnant===v?700:400, color:waterProfile.pregnant===v?D.water:D.muted }}>
                        {label}
                      </button>
                    ))}
                  </div>
                </div>

                {waterCalcError && <div style={{ fontSize:12, color:D.red, background:D.redDim, borderRadius:8, padding:"8px 12px", border:`1px solid ${D.red}30` }}>{waterCalcError}</div>}

                {/* Result */}
                {waterCalcResult && (
                  <div style={{ background:D.waterDim, border:`1px solid ${D.water}40`, borderRadius:12, padding:"14px" }}>
                    <div style={{ fontSize:12, fontWeight:700, color:D.water, marginBottom:10 }}>💧 Your Personalised Goal</div>

                    {/* Big number */}
                    <div style={{ display:"flex", alignItems:"baseline", gap:6, justifyContent:"center", marginBottom:10 }}>
                      <span style={{ fontSize:48, fontWeight:900, color:D.water, lineHeight:1, textShadow:`0 0 20px ${D.water}60` }}>{waterCalcResult.totalMl}</span>
                      <span style={{ fontSize:14, color:D.muted }}>ml/day</span>
                    </div>

                    {/* Breakdown bar */}
                    {waterCalcResult.breakdown && (
                      <div style={{ marginBottom:12 }}>
                        <div style={{ fontSize:10, color:D.muted, marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.05em" }}>Breakdown</div>
                        {[
                          { label:"Baseline", val:waterCalcResult.breakdown.baselineMl, color:D.water },
                          { label:"Activity",  val:waterCalcResult.breakdown.activityMl, color:D.green },
                          { label:"Climate",   val:waterCalcResult.breakdown.climateMl,  color:D.amber },
                          { label:"Other",     val:waterCalcResult.breakdown.otherMl,    color:D.purple },
                        ].filter(r=>r.val>0).map(r=>(
                          <div key={r.label} style={{ marginBottom:6 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
                              <span style={{ fontSize:10, color:D.muted }}>{r.label}</span>
                              <span style={{ fontSize:10, fontWeight:700, color:r.color }}>+{r.val} ml</span>
                            </div>
                            <div style={{ height:3, borderRadius:2, background:D.faint }}>
                              <div style={{ height:3, borderRadius:2, background:r.color, width:`${Math.min((r.val/waterCalcResult.totalMl)*100,100)}%`, transition:"width 0.8s cubic-bezier(0.4,0,0.2,1)", boxShadow:`0 0 4px ${r.color}60` }} />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {waterCalcResult.reasoning && <div style={{ fontSize:11, color:D.muted, lineHeight:1.6, marginBottom:8 }}>{waterCalcResult.reasoning}</div>}
                    {waterCalcResult.tip && (
                      <div style={{ background:D.card, border:`1px solid ${D.border}`, borderRadius:10, padding:"10px 12px", fontSize:11, color:D.text, lineHeight:1.6, marginBottom:10 }}>
                        💡 {waterCalcResult.tip}
                      </div>
                    )}

                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={()=>{ setGoals(g=>({...g,water:waterCalcResult.totalMl})); setWaterCalcOpen(false); setWaterCalcResult(null); }}
                        style={{ flex:1, padding:"10px 0", background:D.water, border:"none", borderRadius:10, color:D.bg, fontWeight:700, fontSize:13, cursor:"pointer", boxShadow:`0 0 12px ${D.water}40` }}>
                        ✓ Set as My Goal
                      </button>
                      <button onClick={()=>setWaterCalcResult(null)} style={{ padding:"10px 14px", background:D.faint, border:`1px solid ${D.border}`, borderRadius:10, color:D.muted, fontSize:13, cursor:"pointer" }}>✕</button>
                    </div>
                  </div>
                )}

                {!waterCalcResult && (
                  <button
                    disabled={waterCalcLoading || !waterProfile.weight}
                    onClick={async()=>{
                      setWaterCalcLoading(true); setWaterCalcError(""); setWaterCalcResult(null);
                      try {
                        const r = await calcWaterGoal(waterProfile);
                        setWaterCalcResult(r);
                      } catch(e) { setWaterCalcError("Couldn't calculate. Check your weight and try again."); }
                      setWaterCalcLoading(false);
                    }}
                    style={{ width:"100%", padding:"12px 0", background:(!waterProfile.weight||waterCalcLoading)?D.faint:D.water, border:"none", borderRadius:12, color:(!waterProfile.weight||waterCalcLoading)?D.muted:D.bg, fontWeight:700, fontSize:14, cursor:(!waterProfile.weight||waterCalcLoading)?"default":"pointer", boxShadow:(!waterProfile.weight||waterCalcLoading)?"none":`0 0 16px ${D.water}40`, transition:"all 0.2s" }}>
                    {waterCalcLoading
                      ? <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><div style={{ display:"flex", gap:3 }}>{[0,1,2].map(i=><div key={i} style={{ width:5,height:5,borderRadius:"50%",background:D.muted,animation:`bounceDot 0.9s ease-in-out ${i*0.18}s infinite` }} />)}</div> Calculating…</span>
                      : "💧 Calculate My Water Goal"}
                  </button>
                )}
              </div>
            )}
          </div>

          {/* ── Today counter ── */}
          <div style={{ textAlign:"center", padding:"10px 0 16px" }}>
            <div style={{ fontSize:52, fontWeight:800, color:water>=goals.water?D.water:D.text, transition:"color 0.4s", lineHeight:1, textShadow:water>=goals.water?`0 0 20px ${D.water}60`:"none" }}>
              {water >= 1000 ? (water/1000).toFixed(1) : water}
              <span style={{ fontSize:22, fontWeight:600, color:D.muted, marginLeft:4 }}>{water>=1000?"L":"ml"}</span>
            </div>
            <div style={{ fontSize:13, color:D.muted, marginTop:4 }}>of {goals.water >= 1000 ? (goals.water/1000).toFixed(1)+"L" : goals.water+"ml"}</div>
            {water>=goals.water&&<div style={{ marginTop:8, fontSize:13, color:D.water, animation:"fadeIn 0.3s" }}>⭐ Daily goal reached!</div>}
          </div>

          {/* ── Manual goal setter ── */}
          <div style={{ display:"flex", alignItems:"center", gap:8, background:D.faint, border:`1px solid ${D.border}`, borderRadius:14, padding:"10px 14px", marginBottom:18 }}>
            <span style={{ fontSize:13, color:D.muted, fontWeight:600, whiteSpace:"nowrap" }}>Daily goal</span>
            <button onClick={()=>setGoals(g=>({...g,water:Math.max(250,g.water-250)}))}
              style={{ width:32,height:32,borderRadius:9,background:D.card,border:`1px solid ${D.border}`,color:D.text,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:1 }}>−</button>
            <div style={{ flex:1, textAlign:"center" }}>
              <span style={{ fontSize:20, fontWeight:800, color:D.water }}>{goals.water >= 1000 ? (goals.water/1000).toFixed(1)+"L" : goals.water+"ml"}</span>
            </div>
            <button onClick={()=>setGoals(g=>({...g,water:Math.min(5000,g.water+250)}))}
              style={{ width:32,height:32,borderRadius:9,background:D.card,border:`1px solid ${D.border}`,color:D.text,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:1 }}>+</button>
            <span style={{ fontSize:10, color:D.muted, whiteSpace:"nowrap" }}>±250ml</span>
          </div>

          {/* ── Glass grid (each = 250ml) ── */}
          {(() => {
            const glasses = Math.round(goals.water / ML_PER_GLASS);
            const filledGlasses = Math.floor(water / ML_PER_GLASS);
            return (
              <div style={{ display:"flex", flexWrap:"wrap", gap:10, justifyContent:"center", marginBottom:22 }}>
                {Array.from({length:glasses}).map((_,i)=>(
                  <button key={i} onClick={()=>setWater(i<filledGlasses ? i*ML_PER_GLASS : (i+1)*ML_PER_GLASS)} title={`${(i+1)*ML_PER_GLASS}ml`}
                    style={{ width:52,height:60,background:i<filledGlasses?D.waterDim:D.card,border:`1px solid ${i<filledGlasses?D.water+"50":D.border}`,borderRadius:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.25s",transform:i<filledGlasses?"scale(1.06)":"scale(1)",fontSize:24,boxShadow:i<filledGlasses?`0 0 8px ${D.water}30`:"none" }}>
                    {i<filledGlasses?"🥛":"🫙"}
                  </button>
                ))}
              </div>
            );
          })()}
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={()=>setWater(w=>Math.max(0,w-250))} disabled={water===0}
              style={{ flex:1, height:44, background:D.card, border:`1px solid ${D.border}`, borderRadius:12, color:water===0?D.faint:D.text, cursor:water===0?"default":"pointer", fontSize:14, fontFamily:"inherit" }}>
              − 250ml
            </button>
            <button onClick={addWater} disabled={water>=goals.water}
              style={{ flex:1, height:44, background:water<goals.water?D.waterDim:D.faint, border:`1px solid ${water<goals.water?D.water+"40":D.border}`, borderRadius:12, color:water<goals.water?D.water:D.faint, cursor:water>=goals.water?"default":"pointer", fontSize:14, transition:"all 0.2s", fontFamily:"inherit", boxShadow:water<goals.water?`0 0 8px ${D.water}20`:"none" }}>
              + 250ml
            </button>
          </div>
          <WaterStats water={water} waterHistory={waterHistory} goals={goals} />
        </>)}

        {/* ── CALENDAR ── */}
        {view === "calendar" && <CalendarView logHistory={logHistory} goals={goals} />}

        {/* ── COACH ── */}
        {view === "coach" && <CoachView entries={entries} goals={goals} weights={weights} heightCm={heightCm} targetWeight={targetWeight} water={water} />}

        {/* ── STATS ── */}
        {view === "stats" && <StatsView entries={entries} goals={goals} />}

      </div>

      {/* BOTTOM NAV */}
      <div style={{ borderTop:`1px solid ${D.border}`, background:D.surface, display:"flex", flexShrink:0 }}>
        {VIEWS.map(v=>{
          const active=view===v, ac=NAV_COLORS[v];
          return (
            <button key={v} onClick={()=>go(v)} style={{ flex:1, padding:"10px 0 8px", background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, position:"relative" }}>
              {active&&<div style={{ position:"absolute", top:0, left:"50%", transform:"translateX(-50%)", width:20, height:2, background:ac, borderRadius:"0 0 3px 3px", boxShadow:`0 0 6px ${ac}` }} />}
              <div style={{ width:32,height:32,borderRadius:10,background:active?ac+"20":"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s" }}>
                <span style={{ fontSize:17 }}>{NAV_ICONS[v]}</span>
              </div>
              <span style={{ fontSize:10, color:active?ac:D.muted, fontWeight:active?700:400, letterSpacing:"0.03em" }}>{LABELS[v]}</span>
            </button>
          );
        })}
      </div>

      <style>{`
        @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes entryIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes bounceDot { 0%,80%,100%{transform:translateY(0);opacity:0.4} 40%{transform:translateY(-6px);opacity:1} }
        @keyframes morphBox { 0%,100%{transform:scale(1) rotate(0deg);opacity:0.3} 50%{transform:scale(0.55) rotate(45deg);opacity:1} }
        @keyframes shimmerBar { 0%{width:0%;margin-left:0%} 50%{width:60%} 100%{width:0%;margin-left:100%} }
        @keyframes shakeX { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
        *{box-sizing:border-box}
        input{caret-color:#fff}
        input::placeholder{color:#555}
        button{font-family:inherit}
        ::-webkit-scrollbar{width:0;height:0}
      `}</style>
    </div>
  );
}

    // Mount the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
